<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Playlist Maker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
  <style>
    :root {
    --bg-color: #1a1b26;
    --panel-color: #24283b;
    --border-color: #414868;
    --text-color: #c0caf5;
    --sub-text-color: #a9b1d6;
    --primary-color: #7aa2f7;
    --danger-color: #f7768e;
    --success-color: #9ece6a;
    --font-family: 'Segoe UI', 'Meiryo', sans-serif;
}

/* --- Base Styles --- */
body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100vh;
    font-family: var(--font-family);
    background-color: var(--bg-color);
    color: var(--text-color);
    overflow: hidden;
    font-size: 16px;
    box-sizing: border-box;
}
*, *:before, *:after { box-sizing: inherit; }

.hidden { display: none !important; }

/* --- Header --- */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 1.5rem;
    background-color: var(--panel-color);
    border-bottom: 1px solid var(--border-color);
    flex-shrink: 0;
}
header h1 {
    margin: 0;
    font-size: 1.5rem;
}
.header-actions {
    display: flex;
    gap: 0.8rem;
}

/* --- Main Layout --- */
.editor-container {
    display: flex;
    gap: 1rem;
    padding: 1rem;
    height: calc(100vh - 70px); /* 70px is header height */
}
.panel {
    background-color: var(--panel-color);
    border-radius: 8px;
    border: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
.panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.8rem 1rem;
    border-bottom: 1px solid var(--border-color);
    flex-shrink: 0;
}
.panel-header h2 {
    margin: 0;
    font-size: 1.2rem;
}
.folder-panel {
    width: 300px;
    flex-shrink: 0;
}
.items-panel {
    flex-grow: 1;
}

/* --- Lists --- */
.list-container {
    overflow-y: auto;
    padding: 0.5rem;
    height: 100%;
}
.list-item {
    display: flex;
    align-items: center;
    padding: 0.8rem;
    margin-bottom: 0.5rem;
    background-color: rgba(0,0,0,0.2);
    border-radius: 5px;
    cursor: grab;
    transition: background-color 0.2s;
    user-select: none;
}
.list-item:hover {
    background-color: rgba(122, 162, 247, 0.2);
}
.list-item.active {
    background-color: var(--primary-color);
    color: var(--bg-color);
    font-weight: bold;
}
.list-item.dragging {
    opacity: 0.5;
    background: var(--border-color);
}
.drag-handle {
    margin-right: 0.8rem;
    opacity: 0.6;
}
.list-item-content {
    flex-grow: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.item-thumb {
    width: 80px;
    height: 45px;
    object-fit: cover;
    border-radius: 4px;
    margin-right: 1rem;
    flex-shrink: 0;
}
.item-info {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
    min-width: 0;
}
.item-info .title { font-size: 1rem; font-weight: 500; }
.item-info .channel { font-size: 0.8rem; opacity: 0.8; }

.empty-state {
    text-align: center;
    padding: 4rem;
    color: var(--sub-text-color);
}

/* --- Forms & Buttons --- */
.btn {
    padding: 0.6rem 1rem;
    border-radius: 5px;
    border: 1px solid var(--border-color);
    background-color: var(--panel-color);
    color: var(--text-color);
    cursor: pointer;
    font-weight: 500;
    transition: all 0.2s;
}
.btn:hover {
    border-color: var(--primary-color);
    color: var(--primary-color);
}
.btn.btn-primary {
    background-color: var(--primary-color);
    border-color: var(--primary-color);
    color: var(--bg-color);
    font-weight: bold;
}
.btn.btn-primary:hover {
    filter: brightness(1.2);
}
.btn-icon {
    background: none;
    border: none;
    color: var(--text-color);
    font-size: 1.2rem;
    cursor: pointer;
    padding: 0.4rem;
    border-radius: 50%;
    width: 32px;
    height: 32px;
}
.btn-icon:hover {
    background-color: var(--border-color);
}
.btn-delete { color: var(--danger-color); }
.btn-edit { color: var(--sub-text-color); }

.item-actions {
    display: flex;
    gap: 0.5rem;
    align-items: center;
}
#input-video-url {
    padding: 0.6rem;
    border: 1px solid var(--border-color);
    border-radius: 5px;
    background-color: var(--bg-color);
    color: var(--text-color);
    width: 300px;
}

/* --- Toast Notification --- */
.toast {
    position: fixed;
    bottom: -100px;
    left: 50%;
    transform: translateX(-50%);
    padding: 1rem 1.5rem;
    border-radius: 8px;
    color: #fff;
    font-weight: bold;
    transition: bottom 0.5s ease-in-out;
    z-index: 1000;
}
.toast.show { bottom: 20px; }
.toast.success { background-color: var(--success-color); }
.toast.error { background-color: var(--danger-color); }
.toast.info { background-color: var(--primary-color); }

/* --- Responsive (Mobile) --- */
@media (max-width: 768px) {
    header { flex-direction: column; gap: 1rem; }
    .editor-container { flex-direction: column; height: calc(100vh - 125px); }
    .folder-panel { width: 100%; height: 200px; }
    #input-video-url { width: 100%; }
    .item-actions { width: 100%; }
}
  </style>
<body>

    <header>
        <h1><i class="fas fa-edit"></i> CMS Playlist Maker</h1>
        <div class="header-actions">
            <label for="import-json" class="btn"><i class="fas fa-folder-open"></i> JSONを開く</label>
            <input type="file" id="import-json" accept=".json,application/json" class="hidden">
            <button id="btn-new" class="btn"><i class="fas fa-file-alt"></i> 新規作成</button>
            <button id="btn-export" class="btn btn-primary"><i class="fas fa-download"></i> JSONを保存</button>
        </div>
    </header>

    <main class="editor-container">
        <!-- Folder Column -->
        <aside class="panel folder-panel">
            <div class="panel-header">
                <h2>フォルダ</h2>
                <button id="btn-add-folder" class="btn-icon" title="新しいフォルダを作成"><i class="fas fa-plus"></i></button>
            </div>
            <div id="folder-list" class="list-container">
                <!-- Folders will be rendered here by JS -->
            </div>
        </aside>

        <!-- Items Column -->
        <section class="panel items-panel">
            <div class="panel-header">
                <h2 id="current-folder-title">動画リスト</h2>
                <div class="item-actions">
                    <input type="text" id="input-video-url" placeholder="YouTube or niconico URL">
                    <button id="btn-add-video" class="btn btn-primary">追加</button>
                </div>
            </div>
            <div id="item-list" class="list-container">
                <div class="empty-state">
                    <p>左のメニューからフォルダを選択するか、新しい動画を追加してください。</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>
<script>
document.addEventListener('DOMContentLoaded', () => {

    // --- STATE ---
    let mediaItems = [];
    let folderSettings = [];
    let currentFolder = '__all';

    // --- DOM ELEMENTS ---
    const importInput = document.getElementById('import-json');
    const btnNew = document.getElementById('btn-new');
    const btnExport = document.getElementById('btn-export');
    const btnAddFolder = document.getElementById('btn-add-folder');
    const btnAddVideo = document.getElementById('btn-add-video');
    const folderListEl = document.getElementById('folder-list');
    const itemListEl = document.getElementById('item-list');
    const urlInput = document.getElementById('input-video-url');
    const currentFolderTitleEl = document.getElementById('current-folder-title');
    const toastEl = document.getElementById('toast');

    // --- INITIALIZATION ---
    init();

    function init() {
        // Event Listeners
        importInput.addEventListener('change', handleFileImport);
        btnNew.addEventListener('click', handleNewPlaylist);
        btnExport.addEventListener('click', handleExport);
        btnAddFolder.addEventListener('click', handleAddFolder);
        btnAddVideo.addEventListener('click', fetchAndAddVideo);
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') fetchAndAddVideo();
        });

        setupDragAndDrop();
        renderAll();
    }

    // --- RENDER FUNCTIONS ---
    function renderAll() {
        renderFolders();
        renderItems();
    }

    function renderFolders() {
        folderListEl.innerHTML = '';
        
        // Add "All Videos" virtual folder
        const allVideosItem = createFolderItem('__all', 'すべての動画');
        folderListEl.appendChild(allVideosItem);

        // Render user folders
        folderSettings.sort((a, b) => a.order - b.order).forEach(folder => {
            const folderItem = createFolderItem(folder.folderName);
            folderListEl.appendChild(folderItem);
        });
    }
    
    function createFolderItem(name, displayName = null) {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.dataset.folderName = name;
        div.draggable = (name !== '__all');

        const itemCount = (name === '__all')
            ? mediaItems.length
            : mediaItems.filter(item => (item.folders || []).includes(name)).length;

        div.innerHTML = `
            <i class="fas fa-grip-vertical drag-handle"></i>
            <div class="list-item-content">${displayName || name} (${itemCount})</div>
            ${name !== '__all' ? `
                <button class="btn-icon btn-edit" title="名前を変更"><i class="fas fa-pen"></i></button>
                <button class="btn-icon btn-delete" title="フォルダを削除"><i class="fas fa-trash"></i></button>
            ` : ''}
        `;
        
        if (name === currentFolder) div.classList.add('active');

        // Event listeners for the item
        div.addEventListener('click', () => selectFolder(name));
        if (name !== '__all') {
            div.querySelector('.btn-edit').addEventListener('click', (e) => {
                e.stopPropagation();
                handleEditFolder(name);
            });
            div.querySelector('.btn-delete').addEventListener('click', (e) => {
                e.stopPropagation();
                handleDeleteFolder(name);
            });
        }
        return div;
    }

    function renderItems() {
        itemListEl.innerHTML = '';
        currentFolderTitleEl.textContent = `動画リスト: ${currentFolder === '__all' ? 'すべての動画' : currentFolder}`;

        const itemsToRender = (currentFolder === '__all')
            ? mediaItems
            : mediaItems.filter(item => (item.folders || []).includes(currentFolder));

        if (itemsToRender.length === 0) {
            itemListEl.innerHTML = `<div class="empty-state"><p>${currentFolder === '__all' ? '動画がありません。URLを追加してください。' : 'このフォルダには動画がありません。'}</p></div>`;
            return;
        }

        itemsToRender.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'list-item';
            div.dataset.itemId = item.originalIndex; // Use originalIndex as a unique ID
            div.draggable = true;

            div.innerHTML = `
                <i class="fas fa-grip-vertical drag-handle"></i>
                <img src="${item.thumbnail}" class="item-thumb" alt="thumbnail">
                <div class="list-item-content item-info">
                    <span class="title" title="${item.title}">${item.title}</span>
                    <span class="channel">${item.channelName}</span>
                </div>
                <button class="btn-icon btn-delete" title="動画を削除"><i class="fas fa-trash"></i></button>
            `;

            div.querySelector('.btn-delete').addEventListener('click', (e) => {
                e.stopPropagation();
                handleDeleteItem(item.originalIndex);
            });

            itemListEl.appendChild(div);
        });
    }

    // --- HANDLERS ---
    function handleFileImport(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = JSON.parse(e.target.result);
                mediaItems = data.mediaItems || [];
                // Ensure unique IDs
                mediaItems.forEach((item, idx) => item.originalIndex = idx);
                folderSettings = data.folderSettings || [];
                currentFolder = '__all';
                showToast('JSONファイルを読み込みました', 'success');
                renderAll();
            } catch (error) {
                showToast('JSONファイルの解析に失敗しました', 'error');
                console.error(error);
            }
        };
        reader.readAsText(file);
    }

    function handleNewPlaylist() {
        if (confirm('現在の編集内容を破棄して、新しいプレイリストを作成しますか？')) {
            mediaItems = [];
            folderSettings = [];
            currentFolder = '__all';
            renderAll();
            showToast('新しいプレイリストを作成しました', 'info');
        }
    }

    function handleExport() {
        if (mediaItems.length === 0) {
            showToast('エクスポートする動画がありません', 'error');
            return;
        }
        // Re-index items before export
        const itemsToExport = [...mediaItems].map((item, index) => ({...item, originalIndex: index}));

        const data = {
            mediaItems: itemsToExport,
            folderSettings: folderSettings
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `playlist_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('JSONファイルとして保存しました', 'success');
    }

    function handleAddFolder() {
        const folderName = prompt('新しいフォルダ名を入力してください:');
        if (folderName && folderName.trim() !== '') {
            if (folderSettings.some(f => f.folderName === folderName)) {
                alert('同じ名前のフォルダが既に存在します。');
                return;
            }
            const newOrder = folderSettings.length > 0 ? Math.max(...folderSettings.map(f => f.order)) + 1 : 1;
            folderSettings.push({ folderName, order: newOrder });
            renderFolders();
        }
    }

    function handleEditFolder(oldName) {
        const newName = prompt(`フォルダ名を変更:\n(現在の名前: ${oldName})`, oldName);
        if (newName && newName.trim() !== '' && newName !== oldName) {
            // Update folderSettings
            const folder = folderSettings.find(f => f.folderName === oldName);
            if(folder) folder.folderName = newName;

            // Update items
            mediaItems.forEach(item => {
                if (item.folders && item.folders.includes(oldName)) {
                    item.folders = item.folders.map(f => f === oldName ? newName : f);
                }
            });

            if (currentFolder === oldName) currentFolder = newName;
            renderAll();
        }
    }

    function handleDeleteFolder(folderName) {
        if (confirm(`フォルダ「${folderName}」を削除しますか？\n(中の動画は削除されず、「未分類」になります)`)) {
            folderSettings = folderSettings.filter(f => f.folderName !== folderName);
            mediaItems.forEach(item => {
                if (item.folders) {
                    item.folders = item.folders.filter(f => f !== folderName);
                }
            });
            if (currentFolder === folderName) currentFolder = '__all';
            renderAll();
        }
    }
    
    function handleDeleteItem(itemId) {
        if (confirm('この動画をプレイリストから削除しますか？')) {
            mediaItems = mediaItems.filter(item => item.originalIndex !== itemId);
            renderAll();
        }
    }

    function selectFolder(folderName) {
        currentFolder = folderName;
        document.querySelectorAll('#folder-list .list-item').forEach(el => {
            el.classList.toggle('active', el.dataset.folderName === folderName);
        });
        renderItems();
    }

    // --- Video Data Fetching ---
    async function fetchAndAddVideo() {
        const url = urlInput.value.trim();
        if (!url) return;
        
        showToast('動画情報を取得中...', 'info');
        
        try {
            const data = await getVideoData(url);
            const newItem = {
                ...data,
                url: url,
                savedAt: new Date().toISOString(),
                playCount: 0,
                folders: (currentFolder !== '__all') ? [currentFolder] : [],
                originalIndex: mediaItems.length > 0 ? Math.max(...mediaItems.map(i => i.originalIndex)) + 1 : 0
            };

            mediaItems.push(newItem);
            urlInput.value = '';
            showToast('動画を追加しました', 'success');
            renderAll();

        } catch (error) {
            showToast(`情報の取得に失敗: ${error.message}`, 'error');
            console.error(error);
        }
    }

    async function getVideoData(url) {
        let endpoint = '';
        let site = '';
        if (url.includes('youtube.com') || url.includes('youtu.be')) {
            site = 'youtube';
            endpoint = `https://www.youtube.com/oembed?url=${encodeURIComponent(url)}&format=json`;
        } else if (url.includes('nicovideo.jp') || url.includes('nico.ms')) {
            site = 'niconico';
            endpoint = `https://www.nicovideo.jp/oembed?url=${encodeURIComponent(url)}`;
        } else {
            throw new Error('サポートされていないURLです');
        }

        // IMPORTANT: Client-side fetching is blocked by CORS. A proxy is required.
        // Replace this with your own CORS proxy server.
        const proxyUrl = 'https://cors-anywhere.herokuapp.com/';
        const response = await fetch(proxyUrl + endpoint);

        if (!response.ok) {
            throw new Error('APIからデータを取得できませんでした');
        }
        
        const data = await response.json();

        return {
            site: site,
            title: data.title,
            channelName: data.author_name,
            thumbnail: data.thumbnail_url
        };
    }
    
    // --- UTILITIES ---
    function showToast(message, type = 'info') {
        toastEl.textContent = message;
        toastEl.className = `toast show ${type}`;
        setTimeout(() => {
            toastEl.className = 'toast';
        }, 3000);
    }
    
    // --- DRAG AND DROP ---
    function setupDragAndDrop() {
        let draggedItem = null;

        const handleDragStart = (e) => {
            draggedItem = e.target;
            setTimeout(() => e.target.classList.add('dragging'), 0);
        };

        const handleDragEnd = (e) => {
            e.target.classList.remove('dragging');
        };
        
        const handleDragOver = (e) => {
            e.preventDefault();
            const container = e.currentTarget;
            const afterElement = getDragAfterElement(container, e.clientY);
            const dragging = container.querySelector('.dragging');
            if (dragging) {
                 if (afterElement == null) {
                    container.appendChild(dragging);
                } else {
                    container.insertBefore(dragging, afterElement);
                }
            }
        };

        const handleDrop = (e) => {
            const container = e.currentTarget;
            const isFolderList = container.id === 'folder-list';
            const listItems = [...container.querySelectorAll('.list-item')];

            if (isFolderList) {
                // Update folderSettings order
                const newOrder = listItems.map(item => item.dataset.folderName).filter(name => name !== '__all');
                folderSettings.forEach(folder => {
                    const index = newOrder.indexOf(folder.folderName);
                    if (index !== -1) folder.order = index;
                });
                renderFolders(); // Re-render to update counts and maintain active state
            } else {
                // Update mediaItems order (only for current folder view)
                const newOrderIds = listItems.map(item => parseInt(item.dataset.itemId));
                // This is a simple re-ordering. More complex logic needed for cross-folder sorting.
                // For this implementation, we reorder the base `mediaItems` array.
                mediaItems.sort((a, b) => {
                    return newOrderIds.indexOf(a.originalIndex) - newOrderIds.indexOf(b.originalIndex);
                });
                renderItems();
            }
        };

        folderListEl.addEventListener('dragstart', handleDragStart);
        folderListEl.addEventListener('dragend', handleDragEnd);
        folderListEl.addEventListener('dragover', handleDragOver);
        folderListEl.addEventListener('drop', handleDrop);
        
        itemListEl.addEventListener('dragstart', handleDragStart);
        itemListEl.addEventListener('dragend', handleDragEnd);
        itemListEl.addEventListener('dragover', handleDragOver);
        itemListEl.addEventListener('drop', handleDrop);
    }

    function getDragAfterElement(container, y) {
        const draggableElements = [...container.querySelectorAll('.list-item:not(.dragging)')];
        return draggableElements.reduce((closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) {
                return { offset: offset, element: child };
            } else {
                return closest;
            }
        }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

});
</script>
</body>
</html>
