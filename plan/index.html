<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家計管理Pro Max</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --primary: #00e676; --sub: #03a9f4; --warn: #ff5252; --text: #fff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 10px; margin:0; padding-bottom: 100px; }
        .card { background: var(--card); padding: 15px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #333; }
        h1, h2 { font-size: 1.2rem; border-left: 4px solid var(--primary); padding-left: 10px; margin: 15px 0; }
        
        input, select, button { 
            width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; border: 1px solid #444; 
            background: #2c2c2c; color: #fff; font-size: 16px; box-sizing: border-box;
        }
        button { background: var(--primary); color: #000; font-weight: bold; border: none; cursor: pointer; }
        .btn-add { background: var(--sub); color: #fff; }
        .btn-del { background: var(--warn); color: #fff; width: auto; padding: 5px 10px; font-size: 12px; }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }

        .flex { display: flex; gap: 8px; align-items: center; }
        .summary-val { font-size: 1.4rem; font-weight: bold; }
        .gb-badge { background: var(--sub); color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 0.8rem; }
        
        canvas { background: #fff; border-radius: 12px; margin-bottom: 20px; max-height: 250px; }
        .expense-row { border-top: 1px solid #333; padding-top: 10px; margin-top: 10px; position: relative; }
    </style>
</head>
<body>

<h1>家計管理Pro Max</h1>

<!-- 全体集計 -->
<div class="card" id="total-summary">
    <h2>全期間合計</h2>
    <div class="flex">
        <div>残金: <span id="total-balance" class="summary-val">0</span>円</div>
        <div id="total-gb-label" class="gb-badge">0 GB</div>
    </div>
    <div id="total-alert" style="color:var(--warn); font-size:0.9rem;"></div>
</div>

<div class="card">
    <label>月別JSONを読み込む</label>
    <input type="file" id="files" multiple accept=".json">
    <button onclick="addMonth()" class="btn-outline">＋ 新しい月を追加</button>
</div>

<canvas id="pie"></canvas>
<canvas id="line"></canvas>

<!-- 月別データリスト -->
<div id="month-container"></div>

<div style="position:fixed; bottom:0; left:0; width:100%; background:#1e1e1e; padding:10px; box-sizing:border-box; display:flex; gap:10px;">
    <button onclick="exportJSON()">JSONで保存出力</button>
</div>

<script>
let allData = [];

// カテゴリ定義
const categories = ["食費", "通信費", "住宅費", "交通費", "娯楽", "その他"];

// ファイル読み込み処理
document.getElementById("files").addEventListener("change", async e => {
    const files = Array.from(e.target.files);
    for (const file of files) {
        try {
            const text = await file.text();
            const json = JSON.parse(text);
            // 月の重複チェック（簡易）
            if (!allData.find(d => d.month === json.month)) {
                allData.push(json);
            }
        } catch (err) { alert("失敗: " + file.name); }
    }
    render();
});

// 月を新規追加
function addMonth() {
    const m = prompt("月を入力してください (例: 2024-01)", new Date().toISOString().slice(0,7));
    if (!m) return;
    allData.push({ month: m, income: [{name:"給料", amount:0}], expenses: [] });
    render();
}

// 明細を追加
function addExpense(mIdx) {
    allData[mIdx].expenses.push({
        date: new Date().toISOString().slice(8,10),
        name: "",
        amount: 0,
        category: "食費",
        gb: 0 // 通信費用のギガ数
    });
    render();
}

// 削除
function deleteExpense(mIdx, eIdx) {
    if(confirm("この行を削除しますか？")) {
        allData[mIdx].expenses.splice(eIdx, 1);
        render();
    }
}

function deleteMonth(mIdx) {
    if(confirm("この月を丸ごと削除しますか？")) {
        allData.splice(mIdx, 1);
        render();
    }
}

// 描画
function render() {
    const container = document.getElementById("month-container");
    container.innerHTML = "";
    
    let grandIncome = 0;
    let grandExpense = 0;
    let grandGB = 0;
    let categoryMap = {};
    let dailyMap = {};

    allData.sort((a,b) => a.month > b.month ? 1 : -1).forEach((m, mIdx) => {
        let mIncome = 0;
        let mExpense = 0;
        let mGB = 0;

        (m.income || []).forEach(i => mIncome += Number(i.amount || 0));

        const monthCard = document.createElement("div");
        monthCard.className = "card";
        monthCard.innerHTML = `
            <div class="flex" style="justify-content:space-between">
                <h2>${m.month}</h2>
                <button class="btn-del" onclick="deleteMonth(${mIdx})">月削除</button>
            </div>
            <label>月収入合計</label>
            <input type="number" value="${m.income[0]?.amount || 0}" onchange="allData[${mIdx}].income[0].amount=Number(this.value);render()">
            <div id="exp-list-${mIdx}"></div>
            <button class="btn-add" onclick="addExpense(${mIdx})">＋ 明細追加</button>
        `;

        const expList = monthCard.querySelector(`#exp-list-${mIdx}`);
        (m.expenses || []).forEach((e, eIdx) => {
            const amt = Number(e.amount || 0);
            const gb = Number(e.gb || 0);
            mExpense += amt;
            mGB += gb;
            categoryMap[e.category] = (categoryMap[e.category] || 0) + amt;
            dailyMap[m.month + "-" + e.date] = (dailyMap[m.month + "-" + e.date] || 0) + amt;

            const div = document.createElement("div");
            div.className = "expense-row";
            div.innerHTML = `
                <div class="flex">
                    <input type="text" style="flex:2" placeholder="品名" value="${e.name}" onchange="allData[${mIdx}].expenses[${eIdx}].name=this.value;render()">
                    <input type="number" style="flex:1.5" placeholder="金額" value="${e.amount}" onchange="allData[${mIdx}].expenses[${eIdx}].amount=Number(this.value);render()">
                </div>
                <div class="flex">
                    <select style="flex:1" onchange="allData[${mIdx}].expenses[${eIdx}].category=this.value;render()">
                        ${categories.map(c => `<option value="${c}" ${e.category===c?'selected':''}>${c}</option>`).join('')}
                    </select>
                    ${e.category === '通信費' ? 
                        `<input type="number" style="flex:0.8; border:1px solid var(--sub)" placeholder="GB" value="${e.gb||0}" onchange="allData[${mIdx}].expenses[${eIdx}].gb=Number(this.value);render()">` : ''
                    }
                    <button class="btn-del" onclick="deleteExpense(${mIdx}, ${eIdx})">×</button>
                </div>
            `;
            expList.appendChild(div);
        });

        grandIncome += mIncome;
        grandExpense += mExpense;
        grandGB += mGB;
        container.appendChild(monthCard);
    });

    // 全体集計更新
    document.getElementById("total-balance").innerText = (grandIncome - grandExpense).toLocaleString();
    document.getElementById("total-gb-label").innerText = grandGB + " GB";
    document.getElementById("total-alert").innerText = grandIncome < grandExpense ? "【警告】トータルで赤字です" : "";

    updateCharts(categoryMap, dailyMap);
}

// グラフ
let charts = {};
function updateCharts(catData, dayData) {
    const commonOpt = { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#fff' } } } };
    
    if(charts.pie) charts.pie.destroy();
    charts.pie = new Chart(document.getElementById("pie"), {
        type: 'doughnut',
        data: {
            labels: Object.keys(catData),
            datasets: [{ data: Object.values(catData), backgroundColor: ['#ff6384','#36a2eb','#ffce56','#4bc0c0','#9966ff','#ff9f40'] }]
        },
        options: commonOpt
    });

    if(charts.line) charts.line.destroy();
    const sortedDates = Object.keys(dayData).sort();
    charts.line = new Chart(document.getElementById("line"), {
        type: 'line',
        data: {
            labels: sortedDates,
            datasets: [{ label: '支出推移', data: sortedDates.map(d=>dayData[d]), borderColor: '#00e676', tension: 0.2 }]
        },
        options: { ...commonOpt, scales: { x: { ticks: { color: '#fff' } }, y: { ticks: { color: '#fff' } } } }
    });
}

// 出力
function exportJSON() {
    const blob = new Blob([JSON.stringify(allData, null, 2)], {type: "application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "kakei_pro_data.json";
    a.click();
}

// 初期化描画
render();
</script>
</body>
</html>
