<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CMS Cloud Player</title>
  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    /* === Base Styles === */
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f0f0f;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* === Header === */
    header {
      padding: 0 20px;
      height: 56px;
      background: #1f1f1f;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
      z-index: 20;
    }
    h1 { margin: 0; font-size: 18px; font-weight: bold; color: #2196F3; }

    /* Right side controls wrapper */
    .header-controls {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    /* Niconico Toggle Style */
    .nico-toggle {
      font-size: 13px;
      color: #eee;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      background: #2a2a2a;
      padding: 4px 10px;
      border-radius: 15px;
      border: 1px solid #444;
    }
    .nico-toggle:hover { background: #333; }
    .nico-toggle input { cursor: pointer; margin: 0; }

    .file-input-wrapper { position: relative; overflow: hidden; display: inline-block; }
    .btn-upload {
      border: 1px solid #2196F3; color: #fff; background: #2196F3;
      padding: 6px 15px; border-radius: 20px; font-size: 13px; cursor: pointer;
      font-weight: bold; transition: background 0.2s;
    }
    .btn-upload:hover { background: #1976D2; }
    .file-input-wrapper input[type=file] {
      position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }

    /* === Main Layout === */
    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Left: Video Player */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #000;
      position: relative;
    }

    .video-wrapper {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    
    #player-container { width: 100%; height: 100%; }
    iframe, video { width: 100%; height: 100%; border: none; }

    /* Controls */
    .controls {
      height: 60px;
      background: #181818;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      border-top: 1px solid #333;
      flex-shrink: 0;
    }
    .btn-ctrl {
      background: #333; border: 1px solid #444;
      color: #fff; font-size: 20px; cursor: pointer;
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .btn-ctrl:hover { background: #444; transform: scale(1.1); }
    .btn-ctrl:active { transform: scale(0.95); }

    /* Right: Playlist */
    .sidebar {
      width: 350px;
      background: #121212;
      border-left: 1px solid #333;
      display: flex;
      flex-direction: column;
    }

    /* Folder Selector */
    .playlist-filter {
      padding: 10px 15px;
      border-bottom: 1px solid #333;
      background: #1f1f1f;
    }
    #folderSelect {
      width: 100%;
      padding: 8px;
      background: #333;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
      font-size: 14px;
      outline: none;
    }

    /* Playlist Items */
    #playlist { 
      flex: 1;
      overflow-y: auto; 
      padding: 0; 
    }
    /* Custom Scrollbar */
    #playlist::-webkit-scrollbar { width: 8px; }
    #playlist::-webkit-scrollbar-track { background: #121212; }
    #playlist::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    
    .item {
      display: flex;
      gap: 10px;
      padding: 10px 15px;
      cursor: pointer;
      transition: background 0.1s;
      border-left: 3px solid transparent;
      border-bottom: 1px solid #222;
    }
    .item:hover { background: #1e1e1e; }
    .item.active { background: #2a2a2a; border-left-color: #2196F3; }
    .item.active .title { color: #2196F3; font-weight: bold; }

    .thumb-wrapper {
      position: relative;
      width: 100px;
      height: 56px;
      flex-shrink: 0;
    }
    .thumb {
      width: 100%; height: 100%;
      object-fit: cover;
      background: #333;
      border-radius: 4px;
    }
    .now-playing-overlay {
      display: none;
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(33, 150, 243, 0.7);
      align-items: center; justify-content: center;
      color: white; font-size: 14px; border-radius: 4px;
    }
    .item.active .now-playing-overlay { display: flex; }

    .info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }
    .title {
      font-size: 13px;
      font-weight: 500;
      color: #eee;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meta { font-size: 11px; color: #888; display: flex; align-items: center; gap: 8px; }
    .site-badge {
        padding: 1px 4px; border-radius: 3px; font-size: 10px;
        background: #444; color: #ccc;
    }
    .site-youtube { background: #cc0000; color: #fff; }
    .site-niconico { background: #333; border: 1px solid #555; color: #fff; }

    /* === Mobile === */
    @media (max-width: 900px) {
      body { overflow: hidden; /* Prevent full body scroll */ }
      .container { flex-direction: column; }
      
      .main-content {
        flex: 0 0 auto; /* Don't grow, size to content */
        width: 100%;
        z-index: 100;
      }
      .video-wrapper {
        aspect-ratio: 16/9;
        height: auto;
      }
      
      .controls { height: 40px; gap: 40px; }
      .btn-ctrl { width: 32px; height: 32px; font-size: 16px; }

      .sidebar {
        width: 100%;
        flex: 1; /* Take remaining height */
        border-left: none;
        border-top: 1px solid #333;
      }
      
      header { height: 50px; padding: 0 10px; }
      h1 { font-size: 16px; }
      .header-controls { gap: 8px; }
      .nico-toggle { font-size: 11px; padding: 3px 8px; }
      .btn-upload { padding: 4px 10px; font-size: 11px; }
    }

    #start-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9); z-index: 999;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
    }
    .btn-start {
      padding: 15px 50px; font-size: 20px; font-weight: bold;
      background: #2196F3; color: white; border: none; border-radius: 50px;
      margin-top: 20px; cursor: pointer; box-shadow: 0 4px 15px rgba(33, 150, 243, 0.4);
      transition: transform 0.1s;
    }
    .btn-start:active { transform: scale(0.95); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1>CMS Cloud Player</h1>
    
    <div class="header-controls">
      <!-- ニコニコ除外チェックボックス -->
      <label class="nico-toggle" title="ニコニコ動画をリストから隠す">
        <input type="checkbox" id="excludeNicoCheck"> No Nico
      </label>

      <div class="file-input-wrapper">
        <button class="btn-upload">📂 JSON読込</button>
        <input type="file" id="fileInput" accept=".json">
      </div>
    </div>
  </header>

  <div class="container">
    <div class="main-content">
      <div class="video-wrapper">
        <div id="player-container">
          <!-- プレースホルダーまたはIframeがここに入ります -->
          <div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:#444;">
            Video Screen
          </div>
        </div>
      </div>
      <div class="controls">
        <button class="btn-ctrl" id="btnPrev" title="前の動画">⏮</button>
        <button class="btn-ctrl" id="btnNext" title="次の動画">⏭</button>
      </div>
    </div>

    <div class="sidebar">
      <!-- フォルダ選択 -->
      <div class="playlist-filter">
        <select id="folderSelect">
          <option value="__ALL__">📚 すべての動画</option>
        </select>
      </div>
      
      <!-- リスト -->
      <div id="playlist">
        <div style="padding:40px 20px; text-align:center; color:#666; font-size:14px;">
          <div style="font-size:40px; margin-bottom:10px;">📂</div>
          右上のボタンから<br>エクスポートしたJSONを読み込んでください
        </div>
      </div>
    </div>
  </div>

  <div id="start-overlay" class="hidden">
    <h2 style="margin-bottom:10px; font-size:24px;">Ready to Play</h2>
    <div style="color:#aaa; font-size:14px;">Imported <span id="importCount">0</span> items</div>
    <button class="btn-start" id="btnUserStart">▶ PLAY</button>
  </div>

  <script>
    let allItems = []; // 全データ
    let currentPlaylist = []; // フィルタリング後の再生リスト
    let currentIndex = 0;
    let ytPlayer = null;
    let isYouTubeApiReady = false;

    // YouTube IFrame API Ready Callback
    function onYouTubeIframeAPIReady() {
      isYouTubeApiReady = true;
    }

    // JSON読込処理
    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      
      reader.onload = (ev) => {
